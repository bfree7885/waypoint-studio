<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Illustration: attack timeline schematic">
  <rect width="960" height="540" fill="#070c14"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#152033" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="url(#grid)" opacity="0.5"/>
  <text x="48" y="56" fill="#6d7c93" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="2">ILLUSTRATION · ATTACK TIMELINE</text>
  <line x1="80" y1="280" x2="880" y2="280" stroke="#2a3b55" stroke-width="2"/>
  <g font-family="IBM Plex Mono, monospace" font-size="12" fill="#9aa8bd">
    <circle cx="160" cy="280" r="8" fill="#101826" stroke="#3d8bfd" stroke-width="2"/>
    <text x="160" y="320" text-anchor="middle">Signal</text>
    <circle cx="340" cy="280" r="8" fill="#101826" stroke="#5eead4" stroke-width="2"/>
    <text x="340" y="320" text-anchor="middle">Context</text>
    <circle cx="520" cy="280" r="8" fill="#101826" stroke="#e7c56b" stroke-width="2"/>
    <text x="520" y="320" text-anchor="middle">Judgment</text>
    <circle cx="700" cy="280" r="8" fill="#101826" stroke="#7dd3a7" stroke-width="2"/>
    <text x="700" y="320" text-anchor="middle">Defense</text>
    <circle cx="840" cy="280" r="8" fill="#101826" stroke="#94a3b8" stroke-width="2"/>
    <text x="840" y="320" text-anchor="middle">Review</text>
  </g>
  <path d="M160 220 L160 260" stroke="#3d8bfd" stroke-width="1.5" opacity="0.6"/>
  <rect x="110" y="170" width="100" height="40" rx="8" fill="#121a2b" stroke="#2a3b55"/>
  <text x="160" y="195" text-anchor="middle" fill="#6d7c93" font-family="IBM Plex Sans, sans-serif" font-size="12">Cited</text>
  <text x="48" y="500" fill="#5eead4" font-family="IBM Plex Mono, monospace" font-size="11">Educational sequence · not an incident log</text>
</svg>
