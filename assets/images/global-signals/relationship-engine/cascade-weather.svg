<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Schematic cascade: weather to port infrastructure to logistics to citizen impact literacy. Not live data.">
  <rect width="960" height="420" fill="#070c14"/>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#152033" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6d7c93"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="url(#g)" opacity="0.45"/>
  <text x="40" y="40" fill="#6d7c93" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.5">SCHEMATIC  WEATHER ’ INFRASTRUCTURE CASCADE</text>
  <text x="40" y="64" fill="#9aa8bd" font-family="IBM Plex Sans, sans-serif" font-size="13">Physical disruption paths without inventing storm telemetry</text>

  <g font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#e8eef7">
    <rect x="40" y="160" width="150" height="56" rx="10" fill="#121a2b" stroke="#3d8bfd" stroke-width="2"/>
    <text x="115" y="185" text-anchor="middle">Weather</text>
    <text x="115" y="204" text-anchor="middle" fill="#6d7c93" font-size="11">signal node</text>

    <rect x="270" y="160" width="170" height="56" rx="10" fill="#121a2b" stroke="#3d8bfd" stroke-width="2"/>
    <text x="355" y="185" text-anchor="middle">Port / infrastructure</text>
    <text x="355" y="204" text-anchor="middle" fill="#6d7c93" font-size="11">1° facility stress</text>

    <rect x="520" y="160" width="170" height="56" rx="10" fill="#121a2b" stroke="#5eead4" stroke-width="2"/>
    <text x="605" y="185" text-anchor="middle">Lane / industry log.</text>
    <text x="605" y="204" text-anchor="middle" fill="#6d7c93" font-size="11">2° logistics lag</text>

    <rect x="760" y="160" width="160" height="56" rx="10" fill="#121a2b" stroke="#e7c56b" stroke-width="2"/>
    <text x="840" y="185" text-anchor="middle">Citizen literacy</text>
    <text x="840" y="204" text-anchor="middle" fill="#6d7c93" font-size="11">3° services / supply</text>
  </g>

  <g fill="none" stroke="#6d7c93" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M190 188 H260"/>
    <path d="M440 188 H510"/>
    <path d="M690 188 H750"/>
  </g>

  <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#9aa8bd">
    <text x="225" y="140" text-anchor="middle">1°</text>
    <text x="225" y="250" text-anchor="middle">why: ops halt risk</text>
    <text x="225" y="266" text-anchor="middle">strength: strong</text>
    <text x="225" y="282" text-anchor="middle">confidence: moderate</text>
    <text x="225" y="298" text-anchor="middle">delay: immediatehours</text>

    <text x="475" y="140" text-anchor="middle">2°</text>
    <text x="475" y="250" text-anchor="middle">why: backlog / reroute</text>
    <text x="475" y="266" text-anchor="middle">strength: moderate</text>
    <text x="475" y="282" text-anchor="middle">confidence: moderate</text>
    <text x="475" y="298" text-anchor="middle">delay: days</text>

    <text x="720" y="140" text-anchor="middle">3°</text>
    <text x="720" y="250" text-anchor="middle">why: delayed goods/services</text>
    <text x="720" y="266" text-anchor="middle">strength: weakmoderate</text>
    <text x="720" y="282" text-anchor="middle">confidence: lowmod</text>
    <text x="720" y="298" text-anchor="middle">delay: daysweeks</text>
  </g>

  <text x="40" y="380" fill="#5eead4" font-family="IBM Plex Mono, monospace" font-size="11">Schematic  cite weather/port notices before display · Coarse geography only</text>
</svg>
