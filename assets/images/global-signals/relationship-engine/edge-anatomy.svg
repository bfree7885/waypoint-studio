<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Schematic anatomy of a Global Signals relationship edge with why, strength, confidence, direction, and time delay. Not live data.">
  <rect width="960" height="480" fill="#070c14"/>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#152033" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7dd3a7"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="url(#g)" opacity="0.45"/>
  <text x="40" y="40" fill="#6d7c93" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.5">SCHEMATIC  RELATIONSHIP EDGE ANATOMY</text>
  <text x="40" y="64" fill="#9aa8bd" font-family="IBM Plex Sans, sans-serif" font-size="13">Every relationship must carry five facets  no bare related to</text>

  <!-- Two nodes -->
  <rect x="80" y="180" width="160" height="70" rx="12" fill="#121a2b" stroke="#3d8bfd" stroke-width="2"/>
  <text x="160" y="212" text-anchor="middle" fill="#e8eef7" font-family="IBM Plex Sans, sans-serif" font-size="15">Node A</text>
  <text x="160" y="232" text-anchor="middle" fill="#6d7c93" font-family="IBM Plex Mono, monospace" font-size="11">type: port</text>

  <rect x="720" y="180" width="160" height="70" rx="12" fill="#121a2b" stroke="#5eead4" stroke-width="2"/>
  <text x="800" y="212" text-anchor="middle" fill="#e8eef7" font-family="IBM Plex Sans, sans-serif" font-size="15">Node B</text>
  <text x="800" y="232" text-anchor="middle" fill="#6d7c93" font-family="IBM Plex Mono, monospace" font-size="11">type: commodity</text>

  <!-- Edge line -->
  <path d="M250 215 H710" fill="none" stroke="#7dd3a7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Facet cards -->
  <g font-family="IBM Plex Sans, sans-serif">
    <rect x="300" y="100" width="360" height="56" rx="8" fill="#0e1626" stroke="#2a3b55"/>
    <text x="320" y="124" fill="#3d8bfd" font-size="11" font-family="IBM Plex Mono, monospace">WHY CONNECTED</text>
    <text x="320" y="144" fill="#e8eef7" font-size="13">Port throughput constrains commodity delivery</text>

    <rect x="260" y="280" width="150" height="70" rx="8" fill="#0e1626" stroke="#2a3b55"/>
    <text x="275" y="304" fill="#5eead4" font-size="11" font-family="IBM Plex Mono, monospace">STRENGTH</text>
    <text x="275" y="328" fill="#e8eef7" font-size="14">moderate ’ strong</text>

    <rect x="430" y="280" width="150" height="70" rx="8" fill="#0e1626" stroke="#2a3b55"/>
    <text x="445" y="304" fill="#e7c56b" font-size="11" font-family="IBM Plex Mono, monospace">CONFIDENCE</text>
    <text x="445" y="328" fill="#e8eef7" font-size="14">moderate</text>

    <rect x="600" y="280" width="150" height="70" rx="8" fill="#0e1626" stroke="#2a3b55"/>
    <text x="615" y="304" fill="#94a3b8" font-size="11" font-family="IBM Plex Mono, monospace">DIRECTION</text>
    <text x="615" y="328" fill="#e8eef7" font-size="14">A ’ B</text>

    <rect x="385" y="370" width="240" height="60" rx="8" fill="#0e1626" stroke="#2a3b55"/>
    <text x="400" y="394" fill="#7dd3a7" font-size="11" font-family="IBM Plex Mono, monospace">TIME DELAY</text>
    <text x="400" y="416" fill="#e8eef7" font-size="14">days · class, not fake precision</text>
  </g>

  <text x="40" y="460" fill="#5eead4" font-family="IBM Plex Mono, monospace" font-size="11">Strength ` confidence · Speculative edges stay labeled or omitted</text>
</svg>
