<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Schematic: Global Signals nodes connected with first, second, and third-order cascade legend. Not live data.">
  <rect width="960" height="560" fill="#070c14"/>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#152033" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="560" fill="url(#grid)" opacity="0.45"/>
  <text x="40" y="42" fill="#6d7c93" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.5">SCHEMATIC  RELATIONSHIP ENGINE OVERVIEW</text>
  <text x="40" y="68" fill="#9aa8bd" font-family="IBM Plex Sans, sans-serif" font-size="14">Everything is a connected node. Cascades narrate 1° ’ 2° ’ 3° effects.</text>

  <!-- Order bands -->
  <rect x="40" y="100" width="880" height="100" rx="10" fill="#0c1420" stroke="#1e2d44"/>
  <rect x="40" y="220" width="880" height="100" rx="10" fill="#0c1420" stroke="#1e2d44"/>
  <rect x="40" y="340" width="880" height="100" rx="10" fill="#0c1420" stroke="#1e2d44"/>

  <text x="56" y="128" fill="#3d8bfd" font-family="IBM Plex Mono, monospace" font-size="11">1° FIRST-ORDER</text>
  <text x="56" y="248" fill="#5eead4" font-family="IBM Plex Mono, monospace" font-size="11">2° SECOND-ORDER</text>
  <text x="56" y="368" fill="#e7c56b" font-family="IBM Plex Mono, monospace" font-size="11">3° THIRD-ORDER</text>

  <!-- Nodes row 1 -->
  <g font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#e8eef7">
    <rect x="200" y="125" width="120" height="40" rx="8" fill="#121a2b" stroke="#3d8bfd" stroke-width="1.5"/>
    <text x="260" y="150" text-anchor="middle">War / Sanction</text>
    <rect x="400" y="125" width="120" height="40" rx="8" fill="#121a2b" stroke="#3d8bfd" stroke-width="1.5"/>
    <text x="460" y="150" text-anchor="middle">Canal / Lane</text>
    <rect x="600" y="125" width="120" height="40" rx="8" fill="#121a2b" stroke="#2a3b55"/>
    <text x="660" y="150" text-anchor="middle">Weather</text>
    <rect x="780" y="125" width="100" height="40" rx="8" fill="#121a2b" stroke="#2a3b55"/>
    <text x="830" y="150" text-anchor="middle">Policy</text>
  </g>

  <!-- Nodes row 2 -->
  <g font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#e8eef7">
    <rect x="280" y="245" width="130" height="40" rx="8" fill="#121a2b" stroke="#5eead4" stroke-width="1.5"/>
    <text x="345" y="270" text-anchor="middle">Commodity</text>
    <rect x="480" y="245" width="130" height="40" rx="8" fill="#121a2b" stroke="#5eead4" stroke-width="1.5"/>
    <text x="545" y="270" text-anchor="middle">Energy</text>
    <rect x="680" y="245" width="140" height="40" rx="8" fill="#121a2b" stroke="#2a3b55"/>
    <text x="750" y="270" text-anchor="middle">Infrastructure</text>
  </g>

  <!-- Nodes row 3 -->
  <g font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#e8eef7">
    <rect x="300" y="365" width="130" height="40" rx="8" fill="#121a2b" stroke="#e7c56b" stroke-width="1.5"/>
    <text x="365" y="390" text-anchor="middle">Industry</text>
    <rect x="500" y="365" width="160" height="40" rx="8" fill="#121a2b" stroke="#7dd3a7" stroke-width="1.5"/>
    <text x="580" y="390" text-anchor="middle">Citizen literacy</text>
    <rect x="720" y="365" width="120" height="40" rx="8" fill="#121a2b" stroke="#2a3b55"/>
    <text x="780" y="390" text-anchor="middle">Currency</text>
  </g>

  <!-- Connectors -->
  <g fill="none" stroke-width="1.75" opacity="0.85">
    <path d="M320 165 L345 245" stroke="#3d8bfd"/>
    <path d="M460 165 L345 245" stroke="#3d8bfd"/>
    <path d="M345 285 L365 365" stroke="#5eead4"/>
    <path d="M545 285 L580 365" stroke="#5eead4"/>
    <path d="M365 405 L500 385" stroke="#e7c56b"/>
  </g>

  <text x="40" y="480" fill="#9aa8bd" font-family="IBM Plex Sans, sans-serif" font-size="13">Each edge carries: why · strength · confidence · direction · time delay</text>
  <text x="40" y="520" fill="#5eead4" font-family="IBM Plex Mono, monospace" font-size="11">Schematic  not a live event graph · No fabricated data</text>
  <text x="40" y="542" fill="#6d7c93" font-family="IBM Plex Mono, monospace" font-size="11">Citizens = impact literacy, not surveillance</text>
</svg>
