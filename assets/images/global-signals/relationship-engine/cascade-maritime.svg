<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Schematic cascade: conflict to canal to commodity to citizen impact literacy. Not live data.">
  <rect width="960" height="420" fill="#070c14"/>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#152033" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6d7c93"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="url(#g)" opacity="0.45"/>
  <text x="40" y="40" fill="#6d7c93" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.5">SCHEMATIC  MARITIME CHOKEPOINT CASCADE</text>
  <text x="40" y="64" fill="#9aa8bd" font-family="IBM Plex Sans, sans-serif" font-size="13">First-, second-, and third-order effects along a trade corridor</text>

  <!-- Nodes -->
  <g font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#e8eef7">
    <rect x="40" y="160" width="150" height="56" rx="10" fill="#121a2b" stroke="#3d8bfd" stroke-width="2"/>
    <text x="115" y="185" text-anchor="middle">War / conflict</text>
    <text x="115" y="204" text-anchor="middle" fill="#6d7c93" font-size="11">signal node</text>

    <rect x="280" y="160" width="160" height="56" rx="10" fill="#121a2b" stroke="#3d8bfd" stroke-width="2"/>
    <text x="360" y="185" text-anchor="middle">Canal / lane</text>
    <text x="360" y="204" text-anchor="middle" fill="#6d7c93" font-size="11">1° direct effect</text>

    <rect x="530" y="160" width="160" height="56" rx="10" fill="#121a2b" stroke="#5eead4" stroke-width="2"/>
    <text x="610" y="185" text-anchor="middle">Commodity / energy</text>
    <text x="610" y="204" text-anchor="middle" fill="#6d7c93" font-size="11">2° downstream</text>

    <rect x="770" y="160" width="150" height="56" rx="10" fill="#121a2b" stroke="#e7c56b" stroke-width="2"/>
    <text x="845" y="185" text-anchor="middle">Citizen literacy</text>
    <text x="845" y="204" text-anchor="middle" fill="#6d7c93" font-size="11">3° impact kinds</text>
  </g>

  <!-- Edges with facet labels -->
  <g fill="none" stroke="#6d7c93" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M190 188 H270"/>
    <path d="M440 188 H520"/>
    <path d="M690 188 H760"/>
  </g>

  <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#9aa8bd">
    <text x="230" y="140" text-anchor="middle">1°</text>
    <text x="230" y="250" text-anchor="middle">why: transit risk</text>
    <text x="230" y="266" text-anchor="middle">strength: strong</text>
    <text x="230" y="282" text-anchor="middle">confidence: moderate</text>
    <text x="230" y="298" text-anchor="middle">delay: hoursdays</text>

    <text x="480" y="140" text-anchor="middle">2°</text>
    <text x="480" y="250" text-anchor="middle">why: cargo delay</text>
    <text x="480" y="266" text-anchor="middle">strength: moderate+</text>
    <text x="480" y="282" text-anchor="middle">confidence: moderate</text>
    <text x="480" y="298" text-anchor="middle">delay: daysweeks</text>

    <text x="725" y="140" text-anchor="middle">3°</text>
    <text x="725" y="250" text-anchor="middle">why: price / availability</text>
    <text x="725" y="266" text-anchor="middle">strength: moderate</text>
    <text x="725" y="282" text-anchor="middle">confidence: lowmod</text>
    <text x="725" y="298" text-anchor="middle">delay: weeks+ / uncertain</text>
  </g>

  <text x="40" y="380" fill="#5eead4" font-family="IBM Plex Mono, monospace" font-size="11">Schematic example  not live intelligence · Evidence required before non-speculative display</text>
</svg>
