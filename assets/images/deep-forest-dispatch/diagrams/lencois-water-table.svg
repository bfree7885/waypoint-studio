<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="wtTitle wtDesc">
  <title id="wtTitle">Seasonal lagoons and the water table</title>
  <desc id="wtDesc">Rain raises a shallow water table into interdune depressions, forming freshwater lagoons. In the dry season the visible surface falls while groundwater remains below.</desc>
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2432"/>
      <stop offset="100%" stop-color="#453c50"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0d3c0"/>
      <stop offset="100%" stop-color="#c9b8a2"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a8a9a"/>
      <stop offset="100%" stop-color="#5a6a7a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="440" fill="url(#sky2)"/>
  <text x="40" y="40" fill="#f2ebe0" font-family="Georgia, serif" font-size="22">How the lagoons appear</text>
  <text x="40" y="66" fill="rgba(242,235,224,0.7)" font-family="sans-serif" font-size="13">Seasonal rain · shallow groundwater · interdune depressions  not a desert mirage</text>

  <!-- Wet panel -->
  <text x="180" y="105" text-anchor="middle" fill="#95a788" font-size="14" font-family="sans-serif">Wet season</text>
  <path d="M60 280 Q120 160 180 250 Q240 160 300 280 L300 360 L60 360 Z" fill="url(#sand)"/>
  <ellipse cx="180" cy="278" rx="58" ry="22" fill="url(#water)"/>
  <line x1="60" y1="300" x2="300" y2="300" stroke="#7a8a9a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="180" y="318" text-anchor="middle" fill="#f2ebe0" font-size="11" font-family="sans-serif">Water table rises into hollows</text>
  <text x="180" y="390" text-anchor="middle" fill="rgba(242,235,224,0.7)" font-size="12" font-family="sans-serif">Freshwater lagoons become visible</text>

  <!-- Dry panel -->
  <text x="680" y="105" text-anchor="middle" fill="#c17a5a" font-size="14" font-family="sans-serif">Dry season</text>
  <path d="M560 280 Q620 160 680 250 Q740 160 800 280 L800 360 L560 360 Z" fill="url(#sand)"/>
  <line x1="560" y1="330" x2="800" y2="330" stroke="#7a8a9a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="680" y="318" text-anchor="middle" fill="#f2ebe0" font-size="11" font-family="sans-serif">Surface dry · water still below</text>
  <text x="680" y="390" text-anchor="middle" fill="rgba(242,235,224,0.7)" font-size="12" font-family="sans-serif">Lagoons shrink or disappear from view</text>

  <text x="40" y="425" fill="rgba(242,235,224,0.55)" font-size="11" font-family="sans-serif">Educational diagram · geology varies locally · Deep Forest Dispatch · Waypoint Studio</text>
</svg>
