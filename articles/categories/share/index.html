<!DOCTYPE html>
<html lang="en" data-product="studio-home">
<head>
  <meta charset="UTF-8">
  <!-- waypoint-security-meta:start -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https:; worker-src 'self' blob:; form-action 'self' https://formsubmit.co; upgrade-insecure-requests">
  <!-- waypoint-security-meta:end -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Waypoint Studio articles — Share category.">
  <title>Share — Articles · Waypoint Studio</title>
  <link rel="stylesheet" href="../../../design-system/css/wds.css">
</head>
<body>
  <a class="wds-skip" href="#main">Skip to content</a>
  <div class="wds-app was-shell" data-wds-app-shell data-product="studio-home" data-hide-local="true" data-shell-depth="0">
    <div data-wds-app-global data-shell-depth="0"></div>
    <main id="main" class="was-home">
      <header class="was-home__hero">
        <p class="wds-eyebrow">Articles · Category</p>
        <h1>Share</h1>
        <p class="was-home__lead"><a href="../../">All articles</a> · <a href="../../../">Home</a></p>
      </header>
      <div id="was-articles-category" data-category="share" aria-busy="true"></div>
    </main>
    <div data-wds-app-footer data-shell-depth="0"></div>
  </div>
  <script src="../../../design-system/js/platform/wds-app-nav-config.js?v=local" defer></script>
  <script src="../../../design-system/js/platform/wds-app-nav.js?v=local" defer></script>
  <script src="../../../design-system/js/platform/wds-security-baseline.js?v=local" defer></script>
  <script src="../../../design-system/js/platform/wds-app-shell.js?v=local" defer></script>
  <script src="../../../design-system/js/platform/wds-articles.js?v=local" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var el = document.getElementById("was-articles-category");
      if (window.WDS && WDS.articles && el) {
        WDS.articles.mountCategory(el, el.getAttribute("data-category"), { depth: 0, base: "../../" });
      }
    });
  </script>
</body>
</html>
