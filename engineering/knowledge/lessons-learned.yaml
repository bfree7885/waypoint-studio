version: 1
lessons:
  - id: L-001
    title: Never commit self-referential build SHAs
    detail: Stamping then committing always lags one commit. Inject GITHUB_SHA into the Pages artifact instead.
  - id: L-002
    title: Engine publish skip ≠ website deploy failure
    detail: Dirty working trees can skip live-engine artifact publish while GitHub Pages still deploys main.
  - id: L-003
    title: CI smoke must not depend on live weather
    detail: Structural App Shell assertions belong in default CI; gate live OIP checks behind WAYPOINT_SMOKE_LIVE.
  - id: L-004
    title: Recover Engineering OS before inventing Agent Ops
    detail: Prefer extending engineering/ orchestrator+agents; mark docs/ai-agents obsolete for runtime; put execution loop in ops/product-board.
  - id: L-005
    title: Subscriber Ready is stricter than CI green
    detail: Open P0–P2 items, repair queues, and unattested policy criteria must block approval even when automation passes.
