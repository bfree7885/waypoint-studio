<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="SignalTerrain dashboard mockup screenshots — sample data only.">
  <title>SignalTerrain Mockup Screenshots</title>
  <link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #070c14;
      color: #d7e2f2;
      font-family: "IBM Plex Sans", sans-serif;
    }
    main {
      width: min(1100px, calc(100% - 1.5rem));
      margin: 0 auto;
      padding: 1.25rem 0 2.5rem;
      display: grid;
      gap: 1.25rem;
    }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.02em; }
    p { color: #9aa8bd; line-height: 1.5; max-width: 40rem; }
    a { color: #5eead4; }
    figure {
      margin: 0;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      overflow: hidden;
      background: #0b1220;
    }
    img { display: block; width: 100%; height: auto; }
    figcaption {
      padding: 0.55rem 0.75rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #6d7c93;
      border-top: 1px solid rgba(148, 163, 184, 0.14);
    }
    .banner {
      background: #121a08;
      border-bottom: 1px solid #3d5a1a;
      color: #d4e8a8;
      padding: 0.55rem 1rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="banner" role="status"><strong>SAMPLE</strong> — Screenshot assets for the SignalTerrain dashboard mockup. Not live intelligence.</div>
  <main>
    <header>
      <h1>Mockup screenshots</h1>
      <p>
        Static SVG screenshots for owner review. Open the interactive layout at
        <a href="./dashboard.html">dashboard.html</a>.
      </p>
    </header>
    <figure>
      <img src="../../../assets/images/signalterrain/mockups/dashboard-full.svg" alt="Full SignalTerrain dashboard mockup screenshot with sample panels" width="1440" height="900">
      <figcaption>dashboard-full.svg · full board</figcaption>
    </figure>
    <figure>
      <img src="../../../assets/images/signalterrain/mockups/what-changed-today.svg" alt="What changed today top panel mockup screenshot" width="1200" height="420">
      <figcaption>what-changed-today.svg · top panel</figcaption>
    </figure>
    <figure>
      <img src="../../../assets/images/signalterrain/mockups/world-attack-map.svg" alt="World attack map schematic sample screenshot" width="1200" height="520">
      <figcaption>world-attack-map.svg · map panel</figcaption>
    </figure>
    <figure>
      <img src="../../../assets/images/signalterrain/mockups/priorities-actors-news.svg" alt="Priorities, threat actors, and news panels mockup screenshot" width="1200" height="640">
      <figcaption>priorities-actors-news.svg · priorities · actors · news</figcaption>
    </figure>
  </main>
</body>
</html>
