<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="SignalTerrain cyber intelligence dashboard — real CISA KEV, NIST NVD, and CISA advisories. Read-only public data.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://waypointstudio.org/side-trails/signalterrain/dashboard/">
  <meta property="og:title" content="SignalTerrain — Cyber intelligence dashboard">
  <meta property="og:description" content="Real read-only cyber intelligence from CISA KEV, NIST NVD, and CISA advisories.">
  <meta property="og:url" content="https://waypointstudio.org/side-trails/signalterrain/dashboard/">
  <title>SignalTerrain — Cyber intelligence dashboard</title>
  <link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../design-system/css/wds-signalterrain-dashboard.css">
</head>
<body class="st-dash">
  <a class="st-dash__skip" href="#st-dash-main">Skip to content</a>
  <header class="st-dash__top">
    <a class="st-dash__brand" href="../">SignalTerrain</a>
    <nav aria-label="Product">
      <a href="../">Landing</a>
      <a href="./" aria-current="page">Dashboard</a>
      <a href="../../../apps/signalterrain/cyber/live.html">Live feeds</a>
      <a href="../../">Side Trails</a>
      <a href="/">Home</a>
    </nav>
  </header>

  <main id="st-dash-main" class="st-dash__shell">
    <noscript>
      <section class="st-panel">
        <h1>Cyber intelligence dashboard</h1>
        <p>Enable JavaScript to render the dashboard from <code>data/cyber/dashboard.json</code>. Fabricated events are never embedded in this page.</p>
      </section>
    </noscript>
    <div id="st-dash-root" aria-busy="true"></div>
  </main>

  <script src="../../../design-system/js/signalterrain/wds-signalterrain-dashboard.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var root = document.getElementById("st-dash-root");
      if (window.WDS && WDS.signalTerrainDashboard) {
        WDS.signalTerrainDashboard.mount(root, {
          dashboardUrl: "../../../data/cyber/dashboard.json"
        });
      } else if (root) {
        root.innerHTML = '<p role="alert">Dashboard script failed to load. <button type="button" onclick="location.reload()">Retry</button></p>';
        root.removeAttribute("aria-busy");
      }
    });
  </script>
</body>
</html>
