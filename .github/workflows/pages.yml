name: Deploy GitHub Pages

# Website deployment is independent of CI and of live-engine data publishing.
# CI remains the quality signal; it must not block shipping committed site surfaces
# (Volunteer, SignalTerrain Cyber, etc.) when smoke flakes or environment issues
# fail the Actions runner.
# Build metadata is injected into the Pages artifact from the exact commit SHA.
# Requires: Repo Settings → Pages → Source = GitHub Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy SHA
        id: sha
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure Pages ignores Jekyll
        run: touch .nojekyll

      - name: Inject deploy build metadata from commit SHA
        run: node scripts/inject-build-metadata.mjs
        env:
          GITHUB_SHA: ${{ steps.sha.outputs.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTIONS: "true"
          WAYPOINT_BUILD_SOURCE: github-pages

      - name: Verify injected metadata matches deploy SHA
        env:
          GITHUB_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const full = process.env.GITHUB_SHA;
          const short = full.slice(0, 7);
          const info = JSON.parse(fs.readFileSync("data/build-info.json", "utf8"));
          const html = fs.readFileSync("index.html", "utf8");
          if (info.commit !== full) throw new Error("build-info commit mismatch: " + info.commit);
          if (info.shortCommit !== short) throw new Error("shortCommit mismatch: " + info.shortCommit);
          if (info.source !== "github-pages") throw new Error("source mismatch: " + info.source);
          if (!html.includes('name="waypoint-build" content="' + short + '"')) {
            throw new Error("HTML marker mismatch");
          }
          console.log("deploy metadata verified", { short, source: info.source, run: info.workflowRunId });
          NODE

      - name: Validate production assets (fail deploy if missing)
        run: node automation/validate-production-assets.mjs

      - name: Validate production links
        run: node automation/validate-production-links.mjs

      - name: Exclude private owner and operator surfaces from Pages
        run: |
          rm -rf private
          rm -rf audits
          rm -rf reports
          rm -rf automation
          rm -rf scripts
          rm -rf engineering
          rm -rf docs/rebuild-2026
          rm -rf docs/audits
          rm -rf docs/turnaround
          rm -rf docs/archive
          rm -rf docs/dashboard-rc25-sprint6
          rm -rf docs/consolidation
          # Owner-review / internal markdown that must not be a public product path
          find docs -type f \( -name '*owner-review*' -o -name '*OWNER-REVIEW*' \) -delete 2>/dev/null || true
          echo "Removed private/, audits/, reports/, automation/, scripts/, engineering/, and internal docs from Pages artifact"
          echo "Public status.html / debug.html remain as non-sensitive operator stubs only"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify production fingerprint and critical routes
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WAYPOINT_PROD_URL: https://waypointstudio.org
          WAYPOINT_VERIFY_RETRIES: "16"
          WAYPOINT_VERIFY_DELAY_MS: "15000"
        run: node automation/verify-production-deploy.mjs
