name: Articles feed refresh

# Scheduled curated-article refresh for GitHub Pages static data.
# Commits only article artifacts. Concurrent Pages deploys from unrelated
# paths are unaffected; this workflow avoids push-to-main loops by:
# - writing only known artifact paths
# - skipping commit when article content hash is unchanged
# - using a bot commit message that pages.yml may still deploy (acceptable,
#   but rate is capped to every 6 hours)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: articles-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh curated articles
        run: node scripts/articles-refresh.mjs
        env:
          ARTICLES_TIMEOUT_MS: "20000"

      - name: Validate fixtures + pipeline tests
        run: node automation/test-articles-rss.mjs

      - name: Detect artifact changes
        id: diff
        run: |
          if git diff --quiet -- data/articles/articles.json data/articles/health.json data/articles/feed-registry.json feeds/waypoint-articles.xml feeds/waypoint-local.xml feeds/waypoint-photography.xml feeds/waypoint-science.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit article artifacts
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "waypoint-articles-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles/articles.json data/articles/health.json data/articles/feed-registry.json \
            feeds/waypoint-articles.xml feeds/waypoint-local.xml feeds/waypoint-photography.xml feeds/waypoint-science.xml
          git commit -m "chore(articles): refresh curated feed artifacts"
          git push
