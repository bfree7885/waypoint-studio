name: Publish Shed Hunting host

# Phase 3A: generate dist/shedhunting/ and push to the companion Pages repo.
# Does not deploy waypointstudio.org. Does not set shedhunting.org DNS/CNAME.
# Does not flip shedDedicatedHostEnabled.

on:
  workflow_dispatch:

concurrency:
  group: shedhunting-host
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build dedicated-host artifact
        run: node scripts/prepare-shed-hunting-host.mjs

      - name: Publish to companion repository
        env:
          SHEDHUNTING_HOST_REPO: bfree7885/shedhunting.org
          SHEDHUNTING_DEPLOY_TOKEN: ${{ secrets.SHEDHUNTING_DEPLOY_TOKEN }}
        run: node scripts/publish-shed-hunting-host.mjs
