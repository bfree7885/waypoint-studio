name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inject local build metadata for tests
        run: node scripts/inject-build-metadata.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
          WAYPOINT_BUILD_SOURCE: github-actions

      - name: Validate production assets
        run: node automation/validate-production-assets.mjs

      - name: Validate production links
        run: node automation/validate-production-links.mjs

      - name: Production recovery regressions
        run: node automation/test-production-recovery.mjs

      - name: Production repair regressions
        run: node automation/test-production-repair.mjs

      - name: Install smoke dependency
        run: npm install ws@8.21.0 --no-save

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Start static server
        run: |
          python3 -m http.server 8080 > /tmp/waypoint-http.log 2>&1 &
          echo $! > /tmp/waypoint-http.pid

      - name: Wait for server readiness
        run: node automation/wait-for-http.mjs http://127.0.0.1:8080/ 30000

      - name: Run headless smoke tests
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          WAYPOINT_SMOKE_ARTIFACTS: automation/artifacts/ci-smoke
        run: node automation/smoke-browser.mjs http://127.0.0.1:8080

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            automation/artifacts/
            /tmp/waypoint-http.log
          if-no-files-found: ignore

      - name: Mobile layout
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node automation/mobile-layout.mjs http://127.0.0.1:8080

      - name: Platform foundation tests
        run: node automation/test-platform-foundation.mjs

      - name: Public portfolio reconciliation
        run: |
          node automation/test-public-portfolio-reconciliation.mjs
          node automation/test-studio-nav-architecture.mjs
          node automation/test-stale-product-identity.mjs
          node automation/test-side-trails.mjs
          node automation/test-home-rc1.mjs
          node automation/test-waypoint-color-system.mjs
          node automation/test-shedhunting-host-readiness.mjs
          node automation/test-shedhunting-phase3c-cutover.mjs

      - name: Articles RSS pipeline tests
        run: node automation/test-articles-rss.mjs

      - name: Deep Forest Dispatch library
        run: node automation/test-deep-forest-dispatch.mjs

      - name: Knowledge Platform tests
        run: node automation/test-knowledge-platform.mjs

      - name: Fieldry MVP tests
        run: node automation/test-fieldry-mvp.mjs

      - name: Hidden Landscapes tests
        run: node automation/test-hidden-landscapes.mjs

      - name: Animal Vision tests
        run: node automation/test-animal-vision.mjs

      - name: Hidden Landscapes science-claim tests
        run: node automation/test-hl-science-claims.mjs

      - name: ForageCast land companion tests
        run: node automation/test-foragecast-land.mjs

      - name: Sheds field JSON import
        run: node automation/test-sheds-import-json.mjs

      - name: Sheds V3.2 Inspect Intelligence
        run: node automation/test-sheds-v3-2-inspect-intel.mjs

      - name: Sheds V1.3 Where should I look
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node automation/test-sheds-v1-3-search-priority.mjs
          node automation/test-sheds-v1-3-map-mobile.mjs

      - name: Sheds V1.4 Scout Spots
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node automation/test-sheds-v1-4-scout-spots.mjs
          node automation/test-sheds-v1-4-map-mobile.mjs

      - name: Sheds V1.5 Hunt Plans
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node automation/test-sheds-v1-5-hunt-plans.mjs
          node automation/test-sheds-v1-5-map-mobile.mjs

      - name: Sheds V1.6 Field Hunt Mode
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node automation/test-sheds-v1-6-field-hunt.mjs
          node automation/test-sheds-v1-6-map-mobile.mjs

      - name: Sheds V1.7 Hunt Track
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node automation/test-sheds-v1-7-hunt-track.mjs
          node automation/test-sheds-v1-7-map-mobile.mjs

      - name: Sheds V1.8 Hunt History
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node automation/test-sheds-v1-8-hunt-history.mjs
          node automation/test-sheds-v1-8-map-mobile.mjs

      - name: Sheds V1.9 Condition Snapshots
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node automation/test-sheds-v1-9-condition-snapshots.mjs
          node automation/test-sheds-v1-9-map-mobile.mjs

      - name: Sheds Today's Hunt
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node automation/test-sheds-today-hunt.mjs
          node automation/test-sheds-today-hunt-v12.mjs
          node automation/test-sheds-today-hunt-mobile.mjs

      - name: SignalTerrain SOTA V0.1–V0.7
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node automation/test-summit-signal-v0-1.mjs
          node automation/test-signalterrain-sota-v0-2.mjs
          node automation/test-signalterrain-sota-v0-3.mjs
          node automation/test-signalterrain-sota-v0-4.mjs
          node automation/test-signalterrain-sota-v0-5.mjs
          node automation/test-signalterrain-sota-v0-6.mjs
          node automation/test-signalterrain-sota-v0-7.mjs
          node automation/test-summit-signal-v0-1-map-mobile.mjs

      - name: Dashboard Discover tests
        if: ${{ !cancelled() }}
        run: node automation/test-dashboard-discover.mjs

      - name: Dashboard Discover correctness
        if: ${{ !cancelled() }}
        run: node automation/test-dashboard-discover-correctness.mjs

      - name: Dashboard reliability tests
        run: node automation/test-dashboard-reliability.mjs

      - name: Dashboard Today Outside tests
        run: node automation/test-dashboard-today-outside.mjs

      - name: Dashboard instrument intelligence tests
        run: node automation/test-dashboard-rebuild-intel.mjs

      - name: Dashboard Happening Now tests
        run: node automation/test-dashboard-rebuild-happening.mjs

      - name: Dashboard rebuild instrument depth
        run: node automation/test-dashboard-rebuild-depth.mjs

      - name: Dashboard V1 visual finish
        run: node automation/test-dashboard-v1-visual-finish.mjs

      - name: Photographer profile tests
        run: node automation/test-photographer-profile.mjs

      - name: Personalized coaching tests
        run: node automation/test-personalized-coaching.mjs

      - name: Persistent profile migration
        run: node automation/test-profile-migration.mjs http://127.0.0.1:8080

      - name: Syntax-check live engine
        run: node --check scripts/waypoint-live-engine.mjs

      - name: Validate location pipeline
        run: node scripts/validate-location.mjs

      - name: Validate dashboard data layer
        run: node scripts/validate-dashboard-data.mjs

      - name: Validate cross-surface consistency
        run: node scripts/validate-surface-consistency.mjs

      - name: Validate location-sensitive modules
        run: node scripts/validate-location-sensitive.mjs

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/waypoint-http.pid ]; then kill "$(cat /tmp/waypoint-http.pid)" || true; fi
