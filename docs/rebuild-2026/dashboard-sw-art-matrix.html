<!DOCTYPE html>
<html lang="en" data-product="dashboard">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard instrument art matrix</title>
  <link rel="stylesheet" href="../../design-system/css/wds.css">
  <link rel="stylesheet" href="../../design-system/css/wds-dashboard-rebuild.css">
  <style>
    body { margin: 0; background: #141210; color: #f2ebe0; font: 14px/1.4 "Source Sans 3", system-ui, sans-serif; }
    h1 { font: 500 1.5rem "Cormorant Garamond", Georgia, serif; margin: 0 0 0.75rem; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.85rem; }
    .card { position: relative; min-height: 11rem; border-radius: 14px; overflow: hidden; isolation: isolate;
      border: 1px solid rgba(224,176,144,0.28); background: #1c1816; }
    .card .wdb-r-widget__art { position: absolute; inset: 0; }
    .card .wdb-r-widget__art-svg { position: absolute; inset: 0; width: 100%; height: 100%; right: 0; opacity: 1; }
    .card .wdb-r-widget__art::after { display: none; }
    .label { position: relative; z-index: 2; margin: 0; padding: 0.55rem 0.75rem; font-size: 0.72rem;
      letter-spacing: 0.07em; text-transform: uppercase; font-weight: 600; text-shadow: 0 1px 8px #141210; }
    @media (max-width: 48rem) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main style="max-width:74rem;margin:0 auto;padding:1.25rem">
    <h1>Instrument art matrix</h1>
    <p style="opacity:.75;margin:0 0 1rem">Conditions ≠ Light ≠ Air ≠ Moon ≠ Wind ≠ Precipitation ≠ Snow</p>
    <div class="grid" id="grid"></div>
  </main>
  <script src="../../design-system/js/dashboard/rebuild/wds-dashboard-rebuild-graphics.js"></script>
  <script>
    var scenes = [
      ["Conditions clear", { kind: "sky", state: "clear" }],
      ["Conditions storm", { kind: "sky", state: "storm" }],
      ["Conditions snow", { kind: "sky", state: "snow" }],
      ["Light sunset", { kind: "sun", state: "sunset" }],
      ["Light day", { kind: "sun", state: "day" }],
      ["Air good", { kind: "aqi", value: 28 }],
      ["Air USG", { kind: "aqi", value: 128 }],
      ["Moon waxing crescent", { kind: "moon", value: 28, phase: "waxing crescent", phaseValue: 0.14 }],
      ["Moon full", { kind: "moon", value: 100, phase: "full", phaseValue: 0.5 }],
      ["Precip heavy", { kind: "precip", probability: 82, intensity: "heavy" }],
      ["Precip dry virga", { kind: "precip", probability: 8 }],
      ["Wind west 22 mph", { kind: "wind", speed: 22, direction: 270 }]
    ];
    var G = WDS.dashboardRebuildGraphics;
    var grid = document.getElementById("grid");
    scenes.forEach(function (pair) {
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML = G.render(pair[1]) + '<p class="label">' + pair[0] + "</p>";
      grid.appendChild(card);
    });
  </script>
</body>
</html>
