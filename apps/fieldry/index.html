        <section class="fld-hero" style="max-width:40rem;margin:0 auto;padding:1.5rem 1rem 2rem">
          <p class="wds-eyebrow">Fieldry</p>
          <h1>A private life list</h1>
          <p>Fieldry is a calm field notebook for what you encounter outdoors — birds, mushrooms, rocks, weather, and more. Record encounters, build your collection, and learn without competition.</p>
          <h2>Who it helps</h2>
          <p>Careful observers who want a private life list and observation notes — no rankings, no social feed.</p>
          <h2>Key capabilities</h2>
          <ul>
            <li>Record date, place, habitat, weather, confidence, and notes</li>
            <li>Build a personal life list across taxa</li>
            <li>Export backups when you want them</li>
          </ul>
          <h2>Privacy philosophy</h2>
          <p>Notes stay on this device by default. Sharing is not the product.</p>
        </section>
      </noscript>
      <div id="fieldry-app" aria-busy="true">
        <section class="fld-hero" aria-label="Fieldry">
          <p class="wds-eyebrow">Fieldry</p>

          <p class="fld-hero__lead">Record encounters, build your collection, and learn without competition. Notes stay on this device. Your life list opens when scripts load.</p>
        </section>
