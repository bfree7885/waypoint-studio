<!DOCTYPE html>
<html lang="en" data-product="dashboard">
<head>
  <meta charset="UTF-8">
  <meta name="waypoint-build" content="local">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Dashboard — weather, light, trails, and outdoor conditions for your region.">
  <title>Dashboard — Waypoint Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking fonts: shell paints with fallbacks first -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap"></noscript>
  <link rel="stylesheet" href="../../design-system/css/wds-dashboard-home.css">
  <link rel="stylesheet" href="../../design-system/css/wds-dashboard-v2.css">
  <link rel="stylesheet" href="../../design-system/css/wds-app-shell.css?v=local">
  <link rel="stylesheet" href="../../css/home-dashboard.css">
  <style>
    /* Critical shell — visible before full CSS graph settles */
    #wds-content-engine { min-height: 70vh; }
    .wdb-page-loading { padding: 1rem 1.1rem 2rem; max-width: 72rem; margin: 0 auto; }
    .wdb-skel { background: linear-gradient(90deg, #ebe7df 25%, #f4f1ea 50%, #ebe7df 75%); background-size: 200% 100%; animation: wdb-shimmer 1.1s ease-in-out infinite; border-radius: 8px; }
    .wdb-skel--title { height: 1.6rem; width: min(18rem, 70%); margin-bottom: 0.6rem; }
    .wdb-skel--sub { height: 0.9rem; width: min(24rem, 90%); margin-bottom: 1rem; }
    .wdb-skel--hero { height: 8.5rem; width: 100%; margin-bottom: 0.85rem; }
    .wdb-skel--tabs { height: 2.5rem; width: 100%; margin-bottom: 0.85rem; border-radius: 999px; }
    .wdb-skel--line { height: 0.85rem; width: 100%; margin-bottom: 0.45rem; }
    @keyframes wdb-shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    @media (prefers-reduced-motion: reduce) { .wdb-skel { animation: none; } }
  </style>
</head>
<body>
  <a class="wds-skip" href="#main">Skip to content</a>
  <div class="wds-app was-shell" data-wds-app-shell data-product="dashboard" data-product-name="Dashboard" data-shell-depth="1">
    <div data-wds-app-global data-shell-depth="1"></div>
    <div data-wds-app-local data-shell-depth="1"></div>

    <div id="wds-location-prompt"></div>

    <main id="main">
      <noscript>
        <section style="max-width:40rem;margin:0 auto;padding:1.5rem 1rem 2rem">
          <p class="wds-eyebrow">Dashboard</p>
          <h1>Outdoor overview</h1>
          <p>Weather, light, trails, and outdoor conditions for your region — a calm starting point before you go outside.</p>
          <p><a href="../../">Studio home</a> · <a href="../../about.html">About</a> · <a href="../../contact.html">Contact</a></p>
        </section>
      </noscript>
      <h1 class="wds-sr-only">Dashboard</h1>
      <div id="wds-content-engine" data-wds-region="us-national" aria-busy="true">
        <div class="wdb-page-loading" role="status">
          <div class="wdb-page-loading__skeleton" aria-hidden="true">
            <div class="wdb-skel wdb-skel--line wdb-skel--title"></div>
            <div class="wdb-skel wdb-skel--line wdb-skel--sub"></div>
            <div class="wdb-skel wdb-skel--hero"></div>
            <div class="wdb-skel wdb-skel--tabs"></div>
            <div class="wdb-skel wdb-skel--line"></div>
            <div class="wdb-skel wdb-skel--line" style="width:88%"></div>
            <div class="wdb-skel wdb-skel--line" style="width:76%"></div>
            <div class="wdb-skel wdb-skel--line" style="width:82%"></div>
          </div>
          <p class="wdb-page-loading__text">Today Outside — building your briefing</p>
          <p class="wdb-page-loading__detail">Shell first — live conditions fill in without blocking the page.</p>
        </div>
      </div>
    </main>

    <div data-wds-app-footer data-shell-depth="1"></div>
  </div>
  <script>
    try { performance.mark("wdb-html-parsed"); } catch (e) {}
  </script>
  <script src="../../design-system/js/wds-build.js?v=local"></script>
  <!-- Nav/shell modules load via wds.js — do not duplicate (double-bind risk). -->
  <script src="../../design-system/js/wds.js?v=local" defer></script>
  <script src="js/home-boot.js?v=local" defer></script>
</body>
</html>
