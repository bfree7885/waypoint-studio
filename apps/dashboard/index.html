    <main id="main">
      <noscript>
        <section style="max-width:40rem;margin:0 auto;padding:1.5rem 1rem 2rem">
          <p class="wds-eyebrow">Dashboard</p>
          <h1>Outdoor overview</h1>
          <p>Weather, light, trails, and outdoor conditions for your region — a calm starting point before you go outside.</p>
          <h2>Who it helps</h2>
          <p>Photographers, walkers, foragers, and anyone who wants conditions before they head out.</p>
          <h2>Key capabilities</h2>
          <ul>
            <li>Weather and outdoor conditions</li>
            <li>Sun, moon, and light context</li>
            <li>Safety and water awareness</li>
            <li>Photography-oriented condition cues</li>
          </ul>
          <h2>Privacy philosophy</h2>
          <p>Location is optional. Map and weather providers may see approximate coordinates when those features run. Field notes stay in other apps on-device by default.</p>
          <p><a href="../../">Studio home</a> · <a href="../../about.html">About</a> · <a href="../../contact.html">Contact</a></p>
        </section>
      </noscript>
      <h1 class="wds-sr-only">Dashboard</h1>
      <div id="wds-content-engine" data-wds-region="us-national" aria-busy="true">
        <div class="wdb-page-loading" role="status">
          <div class="wdb-page-loading__skeleton" aria-hidden="true">

            <div class="wdb-skel wdb-skel--line wdb-skel--sub"></div>

            <div class="wdb-skel wdb-skel--card"></div>
          </div>
          <p class="wdb-page-loading__text">Dashboard — outdoor overview</p>
          <p class="wdb-page-loading__detail">Weather, light, trails, and conditions for your region. Cards appear next while live data loads independently.</p>
        </div>
