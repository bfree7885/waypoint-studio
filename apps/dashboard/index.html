<!DOCTYPE html>
<html lang="en" data-product="dashboard">
<head>
  <meta charset="UTF-8">
  <meta name="waypoint-build" content="local">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Home — customizable outdoor workspace with Today Outside and modular instruments.">
  <link rel="canonical" href="https://waypointstudio.org/">
  <title>Home — Waypoint Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking fonts: shell paints with fallbacks first -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap"></noscript>
  <link rel="stylesheet" href="../../design-system/css/wds.css?v=dash-rc25-s6">
  <link rel="stylesheet" href="../../design-system/css/wds-app-shell.css?v=dash-rc25-s6">
  <link rel="stylesheet" href="../../design-system/css/wds-dashboard-rebuild.css?v=dash-rc3-s3">
  <style>
    #wds-content-engine { min-height: 70vh; }
  </style>
</head>
<body>
  <a class="wds-skip" href="#main">Skip to content</a>
  <div class="wds-app was-shell" data-wds-app-shell data-product="dashboard" data-product-name="Home" data-shell-depth="1" data-quiet-chrome="true">
    <div data-wds-app-global data-shell-depth="1"></div>
    <div data-wds-app-local data-shell-depth="1"></div>

    <div id="wds-location-prompt"></div>

    <main id="main">
      <noscript>
        <section style="max-width:40rem;margin:0 auto;padding:1.5rem 1rem 2rem">
          <p>Home</p>
          <h1>Outdoor workspace</h1>
          <p>Enable JavaScript to open your customizable workspace and Today Outside summary.</p>
          <p><a href="./">Home</a> · <a href="../../about.html">About</a> · <a href="./contact.html">Contact</a></p>
        </section>
      </noscript>
      <h1 class="wds-sr-only">Home</h1>
      <div id="wds-content-engine" data-wds-region="workspace" aria-busy="true">
        <div class="wdb-r-boot" role="status">
          <p class="wdb-r-boot__copy">Opening workspace…</p>
          <p class="wdb-r-boot__detail">Your outdoor view appears first. Data settles as it arrives.</p>
        </div>
      </div>
    </main>

    <div data-wds-app-footer data-shell-depth="1"></div>
  </div>
  <script>
    try { performance.mark("wdb-html-parsed"); } catch (e) {}
  </script>
  <script src="../../design-system/js/wds-build.js?v=local"></script>
  <!-- Nav/shell modules load via wds.js — do not duplicate (double-bind risk). -->
  <script src="../../design-system/js/wds.js?v=dash-rc3-s3" defer></script>
  <script src="js/home-boot.js?v=dash-rc25-s6" defer></script>
</body>
</html>
