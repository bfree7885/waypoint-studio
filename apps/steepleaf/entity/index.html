<!DOCTYPE html>
<html lang="en" data-product="steepleaf">
<head>
  <meta charset="UTF-8">
  <!-- waypoint-security-meta:start -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https:; worker-src 'self' blob:; form-action 'self' https://formsubmit.co; upgrade-insecure-requests">
  <!-- waypoint-security-meta:end -->
  <meta name="waypoint-build" content="local">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Steepleaf entity page — overview, relations, recommendations, and educational context.">
  <title>Entity — Steepleaf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../design-system/css/wds.css">
  <link rel="stylesheet" href="../../../design-system/css/wds-platform-foundation.css">
  <link rel="stylesheet" href="../../../design-system/css/wds-steepleaf.css">
</head>
<body>
  <a class="wds-skip" href="#main">Skip to content</a>
  <div class="wds-app was-shell" data-wds-app-shell data-product="steepleaf" data-product-name="Steepleaf" data-shell-depth="2">
    <div data-wds-app-global data-shell-depth="2"></div>
    <div data-wds-app-local data-shell-depth="2"></div>
    <main id="main" class="wpf-page stl-page">
      <div id="stl-entity-mount" aria-busy="true">
        <div class="wds-boot" role="status" aria-live="polite" data-wds-boot="1">
          <p class="wds-boot__eyebrow">Steepleaf</p>
          <p class="wds-boot__title">Tea page</p>
          <p class="wds-boot__detail">Loading this tea entry from the knowledge graph.</p>
          <div class="wds-boot__track" aria-hidden="true"><span class="wds-boot__bar"></span></div>
          <p class="wds-boot__status">Starting…</p>
        </div>
      </div>
    </main>
    <div data-wds-app-footer data-shell-depth="2"></div>
  </div>
  <script src="../../../design-system/js/platform/wds-platform-catalog.js" defer></script>
  <script src="../../../design-system/js/platform/wds-platform-stores.js" defer></script>
  <script src="../../../design-system/js/platform/wds-app-nav-config.js?v=local" defer></script>
  <script src="../../../design-system/js/platform/wds-app-nav.js?v=local" defer></script>
  <script src="../../../design-system/js/platform/wds-security-baseline.js?v=local" defer></script>
  <script src="../../../design-system/js/platform/wds-platform-resilience.js?v=local" defer></script>
  <script src="../../../design-system/js/platform/wds-platform-ui.js?v=local" defer></script>
  <script src="../../../design-system/js/platform/wds-platform-boot.js?v=local" defer></script>
  <script src="../../../design-system/js/platform/wds-app-shell.js?v=local" defer></script>
  <script src="../../../design-system/js/steepleaf/wds-steepleaf-graph.js" defer></script>
  <script src="../../../design-system/js/steepleaf/wds-steepleaf-search.js" defer></script>
  <script src="../../../design-system/js/steepleaf/wds-steepleaf-recommend.js" defer></script>
  <script src="../../../design-system/js/steepleaf/wds-steepleaf-ai.js" defer></script>
  <script src="../../../design-system/js/steepleaf/wds-steepleaf-ui.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.WDS && WDS.appShell) {
        WDS.appShell.mount({ appId: "steepleaf", productName: "Steepleaf", shellDepth: 2 });
      }
      var mount = document.getElementById("stl-entity-mount");
      var deadline = Date.now() + 12000;
      function start() {
        if (window.WDS && WDS.steepleafUI && typeof WDS.steepleafUI.mountEntity === "function") {
          WDS.steepleafUI.mountEntity(mount);
          return;
        }
        if (Date.now() >= deadline) {
          if (window.WDS && WDS.platformBoot && WDS.platformBoot.fail) {
            WDS.platformBoot.fail(mount, {
              product: "Steepleaf",
              title: "Could not open this tea page",
              detail: "Entity scripts did not load. Check your connection and retry.",
              homeHref: "../",
              supportHref: "../../../support.html"
            });
          } else if (mount) {
            mount.innerHTML =
              '<p role="alert">Tea page failed to load. <button type="button" onclick="location.reload()">Retry</button></p>';
            mount.removeAttribute("aria-busy");
          }
          return;
        }
        if (window.WDS && WDS.platformBoot && WDS.platformBoot.status) {
          WDS.platformBoot.status(mount, "Waiting for entity scripts…");
        }
        requestAnimationFrame(start);
      }
      start();
    });
  </script>
</body>
</html>
