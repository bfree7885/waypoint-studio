<!DOCTYPE html>
<html lang="en" data-product="signalterrain">
<head>
  <meta charset="UTF-8">
  <meta name="waypoint-build" content="local">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="SignalTerrain Cyber ingestion diagnostics — development and maintenance only.">
  <title>Cyber Ingest Health — SignalTerrain (internal)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../design-system/css/wds.css">
  <link rel="stylesheet" href="../../../design-system/css/wds-platform-foundation.css">
  <link rel="stylesheet" href="../../../design-system/css/wds-signalterrain-foundation.css">
  <style>
    .st-health-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .st-health-table th, .st-health-table td { border-top: 1px solid var(--st-line,#d2ccc0); padding: 0.55rem 0.4rem; text-align: left; vertical-align: top; }
    .st-health-badge { display: inline-block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .st-health-actions { margin: 1rem 0; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .st-health-note { color: var(--st-muted,#5a564e); max-width: 40rem; }
  </style>
</head>
<body>
  <a class="wds-skip" href="#main">Skip to content</a>
  <div class="wds-app was-shell" data-wds-app-shell data-product="signalterrain" data-product-name="SignalTerrain" data-shell-depth="2">
    <div data-wds-app-global data-shell-depth="2"></div>
    <div data-wds-app-local data-shell-depth="2"></div>
    <main id="main" class="wpf-page st-page">
      <p>
        <a class="st-back" href="./">← Cyber Awareness</a>
        ·
        <a class="st-back" href="../">SignalTerrain</a>
      </p>
      <header class="st-demo-header">
        <h1>Cyber ingest health</h1>
        <p class="st-lead">Internal diagnostics for connector status, cache age, and normalization counts. Not a public marketing page.</p>
        <p class="st-badge">Development &amp; maintenance only · Mock connectors · No live harvesting</p>
      </header>
      <noscript>
        <p>JavaScript is required to run the mock ingestion pipeline diagnostics.</p>
      </noscript>
      <div class="st-health-actions">
        <button type="button" class="wds-btn wds-btn--primary" id="st-run-ingest">Run mock pipeline</button>
        <button type="button" class="wds-btn wds-btn--ghost" id="st-refresh-health">Refresh health</button>
      </div>
      <p id="st-health-status" class="st-health-note" role="status">Idle.</p>
      <div id="st-health-mount" aria-busy="false"></div>
      <section id="st-provenance-sample" aria-label="Provenance sample"></section>
      <section id="st-changes-sample" aria-label="Change detection sample"></section>
    </main>
    <div data-wds-app-footer data-shell-depth="2"></div>
  </div>
  <script src="../../../design-system/js/platform/wds-app-nav-config.js?v=local" defer></script>
  <script src="../../../design-system/js/platform/wds-app-nav.js?v=local" defer></script>
  <script src="../../../design-system/js/platform/wds-platform-resilience.js?v=local" defer></script>
  <script src="../../../design-system/js/platform/wds-platform-ui.js?v=local" defer></script>
  <script src="../../../design-system/js/platform/wds-app-shell.js?v=local" defer></script>
  <script src="../../../design-system/js/signalterrain/wds-signalterrain-util.js" defer></script>
  <script src="../../../design-system/js/signalterrain/wds-signalterrain-cyber-ingest.js" defer></script>
  <script src="../../../design-system/js/signalterrain/wds-signalterrain-cyber-connectors.js" defer></script>
  <script>
    (function () {
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      var registry = null;
      var lastRun = null;

      function paintHealth(healthRows) {
        var mount = document.getElementById("st-health-mount");
        if (!healthRows || !healthRows.length) {
          mount.innerHTML = "<p class=\"st-health-note\">No health rows yet. Run the mock pipeline.</p>";
          return;
        }
        mount.innerHTML =
          "<table class=\"st-health-table\"><thead><tr>" +
          "<th>Connector</th><th>Status</th><th>Last update</th><th>Latency</th><th>Failures</th>" +
          "<th>Cache age (h)</th><th>Trust</th><th>Ingested</th><th>Normalized</th><th>Rejected</th><th>Notes</th>" +
          "</tr></thead><tbody>" +
          healthRows
            .map(function (h) {
              if (!h) return "";
              return (
                "<tr><td><strong>" +
                esc(h.name || h.connectorId) +
                "</strong><br><span class=\"st-health-note\">" +
                esc(h.connectorId) +
                "</span></td><td><span class=\"st-health-badge\">" +
                esc(h.status) +
                "</span></td><td>" +
                esc(h.lastUpdate || "—") +
                "</td><td>" +
                esc(h.averageLatencyMs != null ? h.averageLatencyMs + " ms" : "—") +
                "</td><td>" +
                esc(h.failureCount) +
                "</td><td>" +
                esc(h.cacheAgeHours != null ? h.cacheAgeHours : "—") +
                "</td><td>" +
                esc(h.trustLevel) +
                "</td><td>" +
                esc(h.objectsIngested) +
                "</td><td>" +
                esc(h.objectsNormalized) +
                "</td><td>" +
                esc(h.objectsRejected) +
                "</td><td>" +
                esc(h.notes || "") +
                "</td></tr>"
              );
            })
            .join("") +
          "</tbody></table>";
      }

      function paintProvenance(merged) {
        var el = document.getElementById("st-provenance-sample");
        var I = WDS.signalTerrainCyberIngest;
        var sample = (merged || []).filter(function (r) {
          return r.cveIds && r.cveIds.indexOf("CVE-2021-44228") >= 0;
        })[0];
        if (!sample) {
          el.innerHTML = "";
          return;
        }
        var q = I.answerProvenanceQuestions(sample);
        el.innerHTML =
          "<h2>Provenance sample — Log4Shell cluster</h2>" +
          "<p><strong>Where from?</strong> " +
          esc(q.whereFrom.join("; ")) +
          "</p>" +
          "<p><strong>When retrieved?</strong> " +
          esc(q.whenRetrieved.join("; ")) +
          "</p>" +
          "<p><strong>Independent sources:</strong> " +
          esc(q.independentSources) +
          "</p>" +
          "<p><strong>Verified?</strong> " +
          esc(q.verified) +
          " · <strong>Confidence:</strong> " +
          esc(q.confidence) +
          " · <strong>Severity:</strong> " +
          esc(q.severity) +
          "</p>" +
          "<p class=\"st-health-note\">" +
          esc(q.note) +
          "</p>";
      }

      function paintChanges() {
        var el = document.getElementById("st-changes-sample");
        var I = WDS.signalTerrainCyberIngest;
        var before = {
          id: "nir_demo",
          title: "CVE-2021-44228",
          severity: "high",
          products: ["cpe:log4j"],
          references: ["https://nvd.nist.gov/"],
          advisoryIds: [],
          verified: false,
          recordType: "shared-vulnerability",
          provenance: [{ connectorId: "conn_nvd-cve", retrievedAt: "2026-07-18T18:00:00Z", sourceLabel: "NVD", verified: true, reliability: "very-high" }]
        };
        var after = {
          id: "nir_demo",
          title: "CVE-2021-44228",
          severity: "critical",
          products: ["cpe:log4j", "cpe:embedded"],
          references: ["https://nvd.nist.gov/", "https://www.cisa.gov/"],
          advisoryIds: ["KEV-CVE-2021-44228"],
          verified: true,
          recordType: "shared-vulnerability",
          provenance: before.provenance
        };
        var changes = I.detectChanges(before, after);
        el.innerHTML =
          "<h2>Change detection sample</h2><ul>" +
          changes
            .map(function (c) {
              return "<li><strong>" + esc(c.changeType) + "</strong> — " + esc(c.summary) + "</li>";
            })
            .join("") +
          "</ul><p class=\"st-health-note\">History is append-only; prior snapshots are not overwritten.</p>";
      }

      function setStatus(msg) {
        document.getElementById("st-health-status").textContent = msg;
      }

      function boot() {
        if (WDS.appShell) {
          WDS.appShell.mount({ appId: "signalterrain", productName: "SignalTerrain", shellDepth: 2 });
        }
        WDS.signalTerrainCyberConnectors
          .loadRegistry("../../../design-system/signalterrain/intelligence/cyber/ingestion/connectors.json")
          .then(function (reg) {
            registry = reg;
            setStatus("Registry loaded (" + reg.list().length + " connectors). Ready.");
            paintHealth(
              reg.list().map(function (c) {
                return WDS.signalTerrainCyberIngest.buildHealth(c, {});
              })
            );
            paintChanges();
          })
          .catch(function (e) {
            setStatus("Failed to load registry: " + e.message);
          });

        document.getElementById("st-run-ingest").addEventListener("click", function () {
          if (!registry) return;
          setStatus("Running independent mock connectors…");
          registry
            .runAll({ force: true, rawBase: "../../../design-system/signalterrain/intelligence/cyber/ingestion/samples/raw/" })
            .then(function (out) {
              lastRun = out;
              paintHealth(out.health);
              paintProvenance(out.merged);
              setStatus(
                "Pipeline complete. Merged " +
                  out.merged.length +
                  " records (" +
                  out.mergeCount +
                  " duplicate merges; attribution preserved)."
              );
            })
            .catch(function (e) {
              setStatus("Pipeline error: " + e.message);
            });
        });

        document.getElementById("st-refresh-health").addEventListener("click", function () {
          if (!registry) return;
          paintHealth(
            registry.list().map(function (c) {
              return WDS.signalTerrainCyberIngest.buildHealth(c, {});
            })
          );
          setStatus("Health refreshed from local cache metadata.");
        });
      }

      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
      else boot();
    })();
  </script>
</body>
</html>
