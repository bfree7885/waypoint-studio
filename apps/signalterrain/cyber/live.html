  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.WDS && WDS.appShell) {
        WDS.appShell.mount({ appId: "signalterrain", productName: "SignalTerrain", shellDepth: 2 });
      }
      if (window.WDS && WDS.signalTerrainCyberLive) {
        WDS.signalTerrainCyberLive.mountLive(document.getElementById("st-live-mount"), {
          liveUrl: "../../../data/cyber/live.json",
          historyUrl: "../../../data/cyber/history.json"
        });
      }
    });
  </script>
